name: website_webview_app
description: "A production-grade configurable Website WebView mobile application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  webview_flutter_android: ^4.14.1
  local_auth: ^2.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
